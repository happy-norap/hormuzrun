<body>
<div id="game"></div>
<div id="labels"></div>

<div id="hud">
  <div id="status" class="panel hudp">
    <div class="row"><span class="lbl">ステージ</span><span id="hStage" class="big">1 / 10</span></div>
    <div class="row"><span class="lbl">積荷</span><span id="hCargo">空荷</span></div>
    <div class="row"><span class="lbl">船体状態</span><span id="hHull">100%</span></div>
    <div class="bar"><div id="hHullBar" style="width:100%"></div></div>
    <div class="row"><span class="lbl">ドローン被弾</span><span id="hDrone">0回</span></div>
    <div class="bar"><div id="hDroneBar" style="width:0%; background:#ff7a4a"></div></div>
    <div class="row opt"><span class="lbl">銃撃被弾</span><span id="hGun">0発</span></div>
    <div class="row"><span class="lbl">乗組員</span><span id="hCrew">負傷 0 / 18名</span></div>
    <div class="row opt"><span class="lbl">機関状態</span><span id="hEngine">正常</span></div>
    <div class="row"><span class="lbl">速力</span><span id="hSpeed">0 kt</span></div>
    <div class="row"><span class="lbl">被発見リスク</span><span id="hExpo">—</span></div>
    <div class="row"><span class="lbl">舵角<span class="pcOnly" style="display:inline"> (A/D)</span></span><span id="hRudder">中央</span></div>
    <div class="rud"><div id="hRudBar"></div><span class="mid"></span></div>
  </div>
  <div id="money" class="panel">
    <div class="lbl">未清算の契約報酬</div>
    <div id="hPending" class="big pos">$3,000,000</div>
    <div class="row" style="justify-content:flex-end"><span class="lbl">今回の損失&nbsp;</span><span id="hLoss" class="neg">$0</span></div>
    <div class="lbl" style="margin-top:6px">清算済み累計スコア</div>
    <div id="hBanked" class="big">$0</div>
  </div>
  <div id="objective" class="panel">
    <div id="hObjective" style="font-weight:700">目的：原油ターミナルへ向かえ</div>
    <div id="hGps" style="margin-top:4px">
      <svg id="gpsArrow" viewBox="0 0 40 40"><polygon points="20,3 32,34 20,26 8,34" fill="#ffd36a" stroke="#000" stroke-width="1"/></svg>
      <span id="hDist">--</span>
    </div>
  </div>
  <div id="warn"></div>
  <div id="costs"></div>
  <div id="progress" class="panel"><div id="progLabel">原油積み込み中…</div><div class="bar"><div id="progBar" style="width:0%"></div></div></div>
  <div id="controls">
    <div><div class="ctlLabel">スロットル (W/S)</div>
      <div class="seg">
        <button class="btn" data-throttle="0">停止</button>
        <button class="btn" data-throttle="1">半速</button>
        <button class="btn on" data-throttle="2">通常</button>
      </div></div>
    <div><div class="ctlLabel">ダッシュ (Space)</div><button id="btnDash" class="btn dash">DASH OFF</button></div>
    <div><div class="ctlLabel">GPS (G)</div><button id="btnGps" class="btn on">GPS ON</button></div>
    <div><div class="ctlLabel">海峡進入前のみ</div><button id="btnCancel" class="btn danger">契約破棄</button></div>
  </div>
  <canvas id="minimap" width="130" height="230"></canvas>
  <div id="pauseHint">P / Esc：一時停止</div>
  <!-- スマートフォン用タッチ操作（PCでは表示されない） -->
  <div id="touchUI">
    <div id="tcLeft">
      <button class="tbtn" data-hold="left" aria-label="左に舵を切る">◀</button>
      <button class="tbtn" data-hold="right" aria-label="右に舵を切る">▶</button>
    </div>
    <div id="tcRight">
      <div class="tcol">
        <button class="tbtn" data-tap="up" aria-label="加速">▲<small>加速</small></button>
        <div id="tThr">通常</div>
        <button class="tbtn" data-tap="down" aria-label="減速">▼<small>減速</small></button>
      </div>
      <div class="tcol">
        <button class="tbtn" id="tDash" data-tap="dash">DASH</button>
        <button class="tbtn" id="tGps" data-tap="gps">GPS</button>
      </div>
    </div>
    <button class="tbtn" id="tCancel" data-tap="cancel">契約破棄<small>海峡入口まで</small></button>
    <div id="tcTop"><button class="tbtn" id="tPause" data-tap="pause" aria-label="一時停止">II</button></div>
  </div>
</div>
<div id="msg"></div>
<div id="whiteout"></div>
<div id="alertFrame"></div>
<div id="alertText"></div>
<div id="radio"><div class="head"><span class="dot"></span>緊急無線 受信中</div><div id="radioLines"></div></div>
<div id="fade"></div>
<div id="overlay"></div>
<div id="rotate"><div class="icon">📱</div><p>スマートフォンを<b>横向き</b>にしてプレイしてください</p></div>

<script src="game.js"></script>
</body>
